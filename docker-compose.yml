services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adsb
      POSTGRES_USER: adsb
      POSTGRES_PASSWORD: adsb
    volumes:
      - adsb-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adsb -d adsb"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  adsb:
    image: cloud-native-airlines/adsb:local
    build:
      context: ${ADSB_SOURCE:-../adsb}
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://adsb:adsb@postgres:5432/adsb?sslmode=disable
      LISTEN_ADDR: 0.0.0.0:8080
    ports:
      - "127.0.0.1:${ADSB_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  nats:
    image: nats:2.10-alpine
    # -m 8222 enables the HTTP monitoring endpoint; the config adds a WebSocket
    # listener on 8080 for browser clients (the Flight Tracker).
    command: ["-c", "/etc/nats/nats.conf", "-m", "8222"]
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
    ports:
      - "127.0.0.1:${NATS_PORT:-4222}:4222"
      - "127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222"
      - "127.0.0.1:${NATS_WS_PORT:-8083}:8080"

  simulator:
    image: cloud-native-airlines/simulator:local
    build:
      context: ${SIM_SOURCE:-../simulator}
      dockerfile: Dockerfile
    environment:
      # Starts paused: open the UI and press play to run the simulation.
      SIM_START_PAUSED: "true"
      SIM_START_TIME: "2026-10-06T14:00:00Z"
      SIM_CLOCK_SPEED: "60"
      SIM_TICK_INTERVAL: "1.0"
      NATS_URL: nats://nats:4222
      SIM_TICK_SUBJECT: cna.sim.tick
    ports:
      - "127.0.0.1:${SIM_PORT:-8000}:8000"
    depends_on:
      - nats

  operations-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: operations
      POSTGRES_USER: operations
      POSTGRES_PASSWORD: operations
    volumes:
      - operations-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operations -d operations"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  operations:
    image: cloud-native-airlines/operations:local
    build:
      context: ${OPERATIONS_SOURCE:-../operations}
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://operations-postgres:5432/operations
      DB_USER: operations
      DB_PASSWORD: operations
      # Supplies the default run_id + simulated time when a request omits them.
      SIMULATOR_URL: http://simulator:8000
    ports:
      - "127.0.0.1:${OPERATIONS_PORT:-18082}:8080"
    depends_on:
      operations-postgres:
        condition: service_healthy
      simulator:
        condition: service_started

  flight-tracker:
    image: cloud-native-airlines/flight-tracker:local
    build:
      context: ${FLIGHT_TRACKER_SOURCE:-../flight-tracker}
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FLIGHT_TRACKER_PORT:-8090}:8080"
    depends_on:
      - nats
      - adsb

  # Built so the dispatcher can launch one container per leg; never started as a
  # long-running service (the profile keeps it out of `up`). `docker compose
  # build` still builds it.
  flight:
    image: cloud-native-airlines/flight:local
    build:
      context: ${FLIGHT_SOURCE:-../flight}
      dockerfile: Dockerfile
    profiles: ["build-only"]

  dispatcher:
    image: cloud-native-airlines/dispatcher:local
    build:
      context: ${DISPATCHER_SOURCE:-../dispatcher}
      dockerfile: Dockerfile
    environment:
      NATS_URL: nats://nats:4222
      SIM_TICK_SUBJECT: cna.sim.tick
      SIM_URL: http://simulator:8000
      OPERATIONS_URL: http://operations:8080
      ADSB_URL: http://adsb:8080
      AIRCRAFT_ID: N100CA
      # Image the dispatcher launches per leg, and the network it attaches those
      # containers to so they resolve nats/adsb/operations by name.
      FLIGHT_IMAGE: cloud-native-airlines/flight:local
      FLIGHT_NETWORK: cloud-native-airlines
      FLIGHT_AUTOREMOVE: "false"
    # Launches Flight containers through the host Docker daemon.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:${DISPATCHER_PORT:-18083}:8080"
    depends_on:
      nats:
        condition: service_started
      adsb:
        condition: service_started
      simulator:
        condition: service_started
      operations:
        condition: service_started

volumes:
  adsb-postgres:
  operations-postgres:

# Fixed network name so the dispatcher can attach launched Flight containers to
# it regardless of the compose project name.
networks:
  default:
    name: cloud-native-airlines
